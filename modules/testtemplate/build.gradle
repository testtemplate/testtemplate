plugins {
  id('java-common-conventions')
  id('maven-publish-conventions')
}

description = 'Main entry point of the TestTemplate library. Assembles the core engine, JUnit integration, and optional extensions behind a single fluent TestBuilder facade; includes YAML-based configuration loading.'

dependencies {
  api project(':testtemplate-api')

  implementation project(':testtemplate-core')
  implementation project(':testtemplate-junit')

  implementation libs.yaml

  compileOnly project(':testtemplate-extension-json')
  compileOnly project(':testtemplate-extension-mockito')

  compileOnly libs.jspecify

  testImplementation libs.assertj
  testImplementation libs.junit

  testCompileOnly libs.jspecify

  testRuntimeOnly libs.junit.runtime
}
